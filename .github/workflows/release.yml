# Builds the plugin on tag push and attaches the three installable files
# (main.js, manifest.json, styles.css) to the GitHub Release.
# This is what BRAT and the Obsidian community marketplace consume.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (type-check + esbuild production)
        run: npm run build

      - name: Verify build artifacts exist
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            main.js manifest.json styles.css
